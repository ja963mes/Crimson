# Installed as /etc/tmpfiles.d/crimson-chromium.conf on the workers (VM1-3).
#
# Every Chrome that recv.py's screenshot step starts (utils/screenshot.py) leaves
# two directories behind in snap Chromium's private /tmp, even after quit():
#   org.chromium.Chromium.XXXXXX                     SingletonSocket + SingletonCookie
#   org.chromium.Chromium.chromium_chrome_url_fetcher_.XXXXXX   empty
# That is about 3 files per screenshot, ~35K a day per VM (measured Oct 24), and
# emptying them at boot made VM1 and VM2 slow to come up. recv.py runs as ubuntu
# and cannot reach this directory (/tmp/snap-private-tmp is root-only), so
# systemd-tmpfiles removes anything here older than an hour.
# crimson-chromium-tmp-clean.timer applies it every 15 minutes; the stock
# systemd-tmpfiles-clean.timer only runs once a day.
e /tmp/snap-private-tmp/snap.chromium/tmp - - - 1h
# Kept: snapd's and X's own entries, and chromedriver's live profiles (scoped_dir),
# which a long crawler session may leave untouched for over an hour.
x /tmp/snap-private-tmp/snap.chromium/tmp/.snap
x /tmp/snap-private-tmp/snap.chromium/tmp/.X11-unix
x /tmp/snap-private-tmp/snap.chromium/tmp/org.chromium.Chromium.scoped_dir*
